<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Eventos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1><a href="{{ url_for('paginas.index') }}">Sistema de Gerenciamento de Eventos</a></h1>
    </header>

    <nav class="navbar">
        <a href="{{ url_for('paginas.pagina_eventos') }}">Eventos</a>
        <a href="{{ url_for('paginas.pagina_plantas_rotas') }}">Planta / Rotas</a>
        <a href="{{ url_for('paginas.pagina_palestras') }}">Palestras</a>
        <a href="{{ url_for('paginas.pagina_palestrantes') }}">Palestrantes</a>
        <a href="{{ url_for('paginas.pagina_patrocinadores') }}">Patrocinadores</a>
        <a href="{{ url_for('paginas.pagina_usuarios') }}">Usuários</a>
        <a href="{{ url_for('paginas.pagina_organizadores') }}">Organizadores</a>
        <a href="{{ url_for('paginas.pagina_inscricoes') }}">Inscrições</a>
        <a href="{{ url_for('paginas.pagina_favoritos') }}">Favoritos</a>
        <a href="{{ url_for('paginas.pagina_feedbacks') }}">Feedbacks</a>
        <a href="{{ url_for('paginas.pagina_avaliacoes') }}">Avaliações</a>
        <a href="{{ url_for('paginas.pagina_notificacoes') }}">Notificações</a>
        <a href="{{ url_for('paginas.pagina_comunicados') }}">Comunicados</a>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
