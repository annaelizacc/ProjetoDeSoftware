{% extends "base.html" %}
{% block title %}Avaliações{% endblock %}

{% block content %}
<h2>Avaliações</h2>
<div id="mensagem" class="alerta"></div>

<div class="card">
    <h3>Avaliar palestra</h3>
    <form id="form-avaliacao">
        <label>ID do Usuário</label>
        <input type="number" id="av-usuario-id" required>
        <label>ID da Palestra</label>
        <input type="number" id="av-palestra-id" required>
        <label>Nota (1 a 5 estrelas)</label>
        <input type="number" id="av-estrelas" min="1" max="5" required>
        <div class="acoes-form">
            <button type="submit" class="btn-primario">Avaliar</button>
        </div>
    </form>
    <p style="font-size:13px;color:#555;">Se o usuário já avaliou esta palestra, a nota é atualizada.</p>
</div>

<div class="card">
    <h3>Avaliações de uma palestra</h3>
    <div class="filtro-linha">
        <div>
            <label>ID da Palestra</label>
            <input type="number" id="busca-palestra-id">
        </div>
        <button class="btn-secundario" onclick="carregarAvaliacoes()">Listar</button>
    </div>
    <p id="media-resultado"></p>
    <table>
        <thead><tr><th>ID</th><th>Usuário</th><th>Estrelas</th></tr></thead>
        <tbody id="avaliacoes-body"></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("form-avaliacao").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
        await apiPost("/avaliacoes/", {
            usuario_id: Number(document.getElementById("av-usuario-id").value),
            palestra_id: Number(document.getElementById("av-palestra-id").value),
            estrelas: Number(document.getElementById("av-estrelas").value),
        });
        mostrarMensagem("mensagem", "Avaliação registrada com sucesso.", "sucesso");
        e.target.reset();
    } catch (erro) {
        mostrarMensagem("mensagem", erro.message, "erro");
    }
});

async function carregarAvaliacoes() {
    const palestraId = document.getElementById("busca-palestra-id").value;
    const tbody = document.getElementById("avaliacoes-body");
    tbody.innerHTML = "";
    try {
        const avaliacoes = await apiGet(`/avaliacoes/palestra/${palestraId}`);
        avaliacoes.forEach((avaliacao) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${avaliacao.id}</td><td>${avaliacao.usuario_id}</td><td>${avaliacao.estrelas}</td>`;
            tbody.appendChild(tr);
        });

        const media = await apiGet(`/avaliacoes/palestra/${palestraId}/media`);
        document.getElementById("media-resultado").textContent =
            `Média de estrelas: ${media.media_estrelas}`;
    } catch (erro) {
        mostrarMensagem("mensagem", erro.message, "erro");
    }
}
</script>
{% endblock %}
