{% extends "base.html" %}
{% block title %}Feedbacks{% endblock %}

{% block content %}
<h2>Feedbacks</h2>
<div id="mensagem" class="alerta"></div>

<div class="card">
    <h3>Registrar comentário</h3>
    <form id="form-feedback">
        <label>ID do Usuário</label>
        <input type="number" id="fb-usuario-id" required>
        <label>ID da Palestra</label>
        <input type="number" id="fb-palestra-id" required>
        <label>Comentário</label>
        <textarea id="fb-comentario" required></textarea>
        <div class="acoes-form">
            <button type="submit" class="btn-primario">Enviar</button>
        </div>
    </form>
</div>

<div class="card">
    <h3>Feedbacks de uma palestra</h3>
    <div class="filtro-linha">
        <div>
            <label>ID da Palestra</label>
            <input type="number" id="busca-palestra-id">
        </div>
        <button class="btn-secundario" onclick="carregarFeedbacks()">Listar</button>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Usuário</th><th>Comentário</th><th>Data</th><th>Ações</th></tr></thead>
        <tbody id="feedbacks-body"></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("form-feedback").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
        await apiPost("/feedbacks/", {
            usuario_id: Number(document.getElementById("fb-usuario-id").value),
            palestra_id: Number(document.getElementById("fb-palestra-id").value),
            comentario: document.getElementById("fb-comentario").value,
        });
        mostrarMensagem("mensagem", "Feedback registrado com sucesso.", "sucesso");
        e.target.reset();
    } catch (erro) {
        mostrarMensagem("mensagem", erro.message, "erro");
    }
});

async function excluirFeedback(id) {
    if (!confirm("Confirma a exclusão deste feedback?")) return;
    try {
        await apiDelete(`/feedbacks/${id}`);
        mostrarMensagem("mensagem", "Feedback removido.", "sucesso");
        carregarFeedbacks();
    } catch (erro) {
        mostrarMensagem("mensagem", erro.message, "erro");
    }
}

async function carregarFeedbacks() {
    const palestraId = document.getElementById("busca-palestra-id").value;
    const tbody = document.getElementById("feedbacks-body");
    tbody.innerHTML = "";
    try {
        const feedbacks = await apiGet(`/feedbacks/palestra/${palestraId}`);
        feedbacks.forEach((feedback) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${feedback.id}</td><td>${feedback.usuario_id}</td>
                <td>${feedback.comentario}</td><td>${feedback.data ?? ""}</td>
                <td><button class="btn-perigo" onclick="excluirFeedback(${feedback.id})">Excluir</button></td>`;
            tbody.appendChild(tr);
        });
    } catch (erro) {
        mostrarMensagem("mensagem", erro.message, "erro");
    }
}
</script>
{% endblock %}
